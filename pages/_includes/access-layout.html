<!doctype html>
<html lang="{{ lang }}">
  <head>
    <title>{{ title }}</title>
    <meta charset="utf-8" />
    <meta name="Author" content="State of California" />
    <meta name="Description" content="{{ description }}" />
    {%- if noindex %}
    <meta name="robots" content="noindex" />
    {%- elseif noindex_follow %}
    <meta name="robots" content="noindex, follow" />
    {%- else %}
    <meta name="robots" content="index, follow" />
    {%- endif %}
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="HandheldFriendly" content="True" />
    <meta name="MobileOptimized" content="320" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <!-- Primary Meta Tags -->
    <meta name="title" content="{{ title }}" />

    <!-- Open Graph / Facebook -->
    <meta property="og:locale" content="{{ lang }}" />
    <meta property="og:site_name" content="{{ title }}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{ canonical }}" />
    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />

    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- FONT-->
    <!-- Preconnects and preloads -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/publicsans/v18/ijwRs572Xtc6ZYQws9YVwnNGfJ7QwOk1.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
    <link
      rel="preload"
      href="/fonts/CaGov.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
  </head>
  {% set purgeCssHtml %} {{ content | safe }} {% endset -%} {{ cssBundle |
  purgeCSS(purgeCssHtml) | cssmin | wrapTag('style') | safe }}

  <body>
    {{ purgeCssHtml | safe }}
  </body>
</html>
